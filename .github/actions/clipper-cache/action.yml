name: Clipper volume cache (mount)
description: >
  Lazily mount a clipper volume as the cargo target dir, with branch->master
  tag fallback. Cold start (no tags exist yet) degrades to a plain directory;
  the push step seeds the tag either way. Pair with explicit push/unmount
  steps at the end of the job (composite actions cannot have post steps).

inputs:
  key:
    description: Cache lineage key, typically the job name.
    required: true
  repo:
    description: Registry repository holding the cache tags.
    required: false
    default: clipper.dev/clipper/ra-ci-cache

runs:
  using: composite
  steps:
    - name: Install clipper
      uses: clipper-registry/setup-clipper@main

    - name: Install fuse-overlayfs and git-restore-mtime
      shell: bash
      run: sudo apt-get install -y --no-install-recommends fuse-overlayfs git-restore-mtime

    # Push chunks the target into the local store before uploading, so peak
    # disk is ~2x the target size -- more than the runner's root partition
    # holds for a target this big. /mnt is the runner's large scratch disk.
    - name: Put the clipper store on the big disk
      shell: bash
      run: |
        sudo mkdir -p /mnt/clipper-store
        sudo chown "$(id -u):$(id -g)" /mnt/clipper-store
        echo "CLIPPER_STORE=/mnt/clipper-store" >> "$GITHUB_ENV"

    # Cargo freshness compares source mtimes against cached artifacts; a
    # fresh checkout stamps every file with "now", which would silently
    # invalidate the entire cache. Requires fetch-depth: 0 on the checkout.
    - name: Restore source mtimes from git history
      shell: bash
      run: git restore-mtime

    - name: Mount target cache
      shell: bash
      env:
        CACHE_REPO: ${{ inputs.repo }}
        CACHE_KEY: ${{ inputs.key }}
      run: |
        set -uo pipefail
        REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        REF="${REF//\//-}"
        BRANCH_TAG="$CACHE_REPO:$CACHE_KEY-$REF"
        MASTER_TAG="$CACHE_REPO:$CACHE_KEY-master"
        echo "CLIPPER_CACHE_TAG=$BRANCH_TAG" >> "$GITHUB_ENV"
        mkdir -p target
        if clipper volume mount target "$BRANCH_TAG" "$MASTER_TAG"; then
          echo "mounted cache (fallback order: $BRANCH_TAG, $MASTER_TAG)"
        else
          echo "no cache tag found; cold start (push will seed $BRANCH_TAG)"
        fi
